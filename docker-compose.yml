services:
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-backend
    networks:
      - red-cba
    
  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  app-backend:
    build: .

    container_name: app-backend

    ports:
      - "5050:5050"

    depends_on:
      - servidor-bd

    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

  networks:
    red-cba:
      name: red-cba-ejemplo

volumes:
  mysql_data: